<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<html lang="en" data-theme=""="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- tailwind & daisy UI css -->

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Font awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>

</head>

<body class="min-h-screen max-w-md mx-auto bg-base-200">
    <header class="border-b-1 border-gray-200">
        <section class="w-11/12 mx-auto flex justify-between items-center py-4">
            <div class="flex gap-2">
                <div class="w-16 flex flex-col gap-2">
                    <img src="./assets/logo.png" alt="">
                </div>
                <div>
                    <h1>$<span id="balance" class="font-extrabold text-lg">45000</span></h1>
                    <p class="text-neutral/50">Available Balance</p>
                </div>
            </div>
            <div>
                <a class="btn rounded-lg" href="/index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i>Log
                    Out</a>
            </div>
        </section>
    </header>

    <section class="w-11/12 mx-auto space-y-2 pt-5 py-4">
        <h1 class="font-bold text-2xl">Welcome to Pay<span class="text-[#7460FF]">oo</span></h1>
        <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low.</p>
        <div class="grid grid-cols-3 gap-3 mt-6">
            <button class="btn rounded-xl flex-col w-32 h-24 py-3 ">
                <img src="./assets/opt-1.png" alt="">
                <p>Add Money</p>
            </button>
            <button class="btn rounded-xl flex-col h-24 py-3 w-32 ">
                <img src="./assets/opt-2.png" alt="">
                <p>Cashout</p>
            </button>
            <button class="btn rounded-xl flex-col h-24 py-3 w-32  ">
                <img src="./assets/opt-3.png" alt="">
                <p>Transfer Money</p>
            </button>
            <button class="btn rounded-xl flex-col h-24 py-3 w-32 ">
                <img src="./assets/opt-4.png" alt="">
                <p>Get Bonus</p>
            </button>
            <button class="btn rounded-xl flex-col h-24 py-3 w-32 ">
                <img src="./assets/opt-5.png" alt="">
                <p>Pay Bill</p>
            </button>
            <button class="btn rounded-xl flex-col h-24 py-3 w-32 ">
                <img src="./assets/opt-6.png" alt="">
                <p>Transactions</p>
            </button>
        </div>
    </section>

</body>
</html>
