<!DOCTYPE html>
<html lang="en" data-theme=""="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Login</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!-- tailwind & daisy UI css -->

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- Font awesome -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>* {font-family: "Outfit", sans-serif; }</style>

</head>

<body class="min-h-screen max-w-md  mx-auto bg-base-200">
    <section>
        <div class="w-72 pt-52 mx-auto">
            <img src="./assets/Logo-full.png" alt="">
        </div>
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-1xl mt-15 mx-auto rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset space-y-2">
                    <label  class="label font-bold text-lg text-black">Mobile Number</label>
                    <input id="input-number" type="text" minlength="11" maxlength="11" class="input rounded-full bg-base-200" placeholder="Enter your number" />
                    <label class="label font-bold text-lg text-black">4 Digit Pin</label>
                    <input id="input-pin" type="password"minlength="4" maxlength="4" class="input rounded-full bg-base-200" placeholder="Enter 4 Digit Pin" />
                    <div><a class="link link-hover">Forgot password?</a></div>
                    <button id="login-btn" class="btn btn-primary rounded-full mt-4">Login</button>
                </fieldset>
            </div>
        </div>
    </section>

    <script src="/script/login.js"></script>
</body>

</html>
